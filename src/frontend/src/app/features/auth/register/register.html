<section class="auth-page">

  <div class="auth-container">

    <a routerLink="/" class="back">
      <mat-icon>arrow_back</mat-icon>
      Voltar
    </a>

    <div class="auth-card">

      <div class="logo">
        postfolio
      </div>

      <h1>Crie sua conta</h1>
      <p class="subtitle">Comece a construir seu portfólio hoje</p>

      <div class="social-login">

        <button class="social-btn">
          <mat-icon>public</mat-icon>
          Continuar com Google
        </button>

        <button class="social-btn">
          <mat-icon>code</mat-icon>
          Continuar com GitHub
        </button>

      </div>

      <div class="divider">
        <span>ou crie com email</span>
      </div>

      <form (submit)="register()">

        <label>Nome completo</label>
        <div class="input">
          <mat-icon>person</mat-icon>
          <input type="text" placeholder="Seu nome" [(ngModel)]="name" name="name">
        </div>

        <label>Email</label>
        <div class="input">
          <mat-icon>mail</mat-icon>
          <input type="email" placeholder="seu@email.com" [(ngModel)]="email" name="email">
        </div>

        <label>Senha</label>
        <div class="input">
          <mat-icon>lock</mat-icon>
          <input type="password" placeholder="mínimo 6 caracteres" [(ngModel)]="password" name="password">
        </div>

        <label>Confirmar senha</label>
        <div class="input">
          <mat-icon>lock</mat-icon>
          <input type="password" placeholder="digite novamente" [(ngModel)]="confirmPassword" name="confirmPassword">
        </div>

        <label class="terms">
          <input type="checkbox" [(ngModel)]="acceptTerms" name="terms">
          Eu aceito os <a>Termos de Uso</a> e a <a>Política de Privacidade</a>
        </label>

        <button class="primary-btn">
          Criar Conta
        </button>

      </form>

      <p class="bottom-text">
        Já tem uma conta?
        <a routerLink="/login">Entrar</a>
      </p>

    </div>

  </div>

</section>
